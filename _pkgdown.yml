url: https://einarhjorleifsson.github.io/ogis/

template:
  bootstrap: 5

reference:
- title: "Start a map"
  desc: >
    A map from data, which the layer functions add to with the pipe.
  contents:
  - og_map
- title: "Layers"
  desc: >
    A mark each, one row of the data to one mark: points, paths (rows joined in time), lines, segments, areas and
    text.
  contents:
  - og_point
  - og_path
- title: "The sea floor"
  desc: >
    A depth model's depth in colour, its relief and its contours, made in the page from its tiles: an MBTiles file, a
    grid, or one named once by OGIS_DEPTH.
  contents:
  - og_relief
- title: "Place names"
  desc: >
    A list of place names, each from its own zoom, found by the page's Find box, what is known of each on a click; a
    table, a file, or one named once by OGIS_NAMES.
  contents:
  - og_names
- title: "Values by cell"
  desc: >
    A table of cells coloured by a value per square kilometre, such as fishing effort by gear and year, chosen in the
    page; a table, a Parquet file, or one named once by OGIS_CELLS.
  contents:
  - og_cells
- title: "Vessel tracks"
  desc: >
    Pings as a track, a time panel of speed (a vessel, then a trip), lanes of what the vessel did, and the effort
    following the vessel chosen: a quick look at each step of a track's processing.
  contents:
  - og_tracks
- title: "Time"
  desc: >
    A panel under the map: a group's rows over time, linked to the map.
  contents:
  - og_time
- title: "In MapLibre's own terms"
  desc: >
    A layer, its section and its tiles made by hand, for what the layer functions do not draw; added to the pipe by
    og_add_layer().
  contents:
  - og_layer
  - og_add_layer
  - og_section
  - og_tiles_table
  - og_tiles_dem
  - og_tiles_mbtiles
- title: "Colours and base maps"
  contents:
  - og_palettes
- title: "A page of your own"
  desc: >
    A script of your own on the map, and routes of its own on the server: for a page that does more than show.
  contents:
  - og_script
- title: "Show and share"
  desc: >
    A map served from R on this machine, or written as a folder that opens with no R.
  contents:
  - print.og_map
  - og_serve
  - og_bundle
- title: "What readers write"
  desc: >
    Notes and verdicts written on a served map, kept in a file beside it.
  contents:
  - og_notes
  - og_verdicts
- title: "Example data"
  contents:
  - og_example
  - dansk
  - dansk_harbours
  - dansk_relief
  - trawlsurvey
  - trawlsurveytows
