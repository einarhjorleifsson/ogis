# Build the pkgdown site and publish it on GitHub Pages (the gh-pages branch), after r-lib/actions' pkgdown example.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # the example data are Git LFS objects
      - uses: r-lib/actions/setup-pandoc@v2
      # the articles are Quarto documents (vignettes/articles/*.qmd), which pkgdown renders with Quarto
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::quarto, local::.
          needs: website
      # ramb's example data are Git LFS objects, which GitHub's source archive (how pak installs ramb) holds only as
      # pointers; the "Vessel tracks" article reads them, so ramb is installed again from a clone that fetches them
      - name: ramb with its example data
        run: |
          git lfs install
          git clone --depth 1 https://github.com/einarhjorleifsson/ramb.git "$RUNNER_TEMP/ramb"
          test "$(stat -c %s "$RUNNER_TEMP/ramb/inst/extdata/dansk.parquet")" -gt 100000
          R CMD INSTALL "$RUNNER_TEMP/ramb"
      - name: Build the site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      - name: Publish it on the gh-pages branch
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          # the branch made to hold this build alone: an article's maps are folders named by their content, so a
          # deploy that kept the old files kept every map an article ever had
          clean: true
          branch: gh-pages
          folder: docs
